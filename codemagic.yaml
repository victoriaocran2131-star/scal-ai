workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    environment:
      groups:
        - expo_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Install EAS CLI
        script: |
          npm install -g eas-cli
      - name: Login to Expo
        script: |
          eas login --token $EXPO_TOKEN
      - name: Build iOS App Store
        script: |
          eas build --platform ios --profile production --non-interactive
      - name: Submit to App Store
        script: |
          eas submit --platform ios --profile production --non-interactive
    artifacts:
      - path: build/ios/ipa/*.ipa
        name: ipa
