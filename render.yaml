services:
  - type: web
    name: scal-ai
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd .. && cp -r server/node_modules .
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
